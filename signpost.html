<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signpost</title>
    <link rel="stylesheet" href="gridstack/gridstack.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="gridstack/gridstack-all.js"></script>
    <script src="signpost.js"></script>
</head>

<body>
    <!-- Gridstack desktop -->
    <div id="desktop" class="grid-stack">
        <!-- Dummy tile for testing drag/resize -->
        <!-- <div class="grid-stack-item"
           data-gs-x="0" data-gs-y="0"
           data-gs-width="2" data-gs-height="2">
        <div class="grid-stack-item-content">
          Test Tile
        </div>
      </div> -->
    </div>

    <div id="bubble-message" class="hidden"></div>

    <!-- Toolbar -->
    <div id="toolbar">
        <button id="btn-add" title="Add bookmark" aria-label="Add bookmark">
            <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h7" />
                <path d="M18 3v6" />
                <path d="M15 6h6" />
            </svg>
        </button>
        <button id="btn-settings" title="Settings" aria-label="Settings">
            <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z" />
                <path
                    d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.05.05a2.05 2.05 0 0 1-2.9 2.9l-.05-.05a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.02 1.56v.15a2.05 2.05 0 0 1-4.1 0V21a1.7 1.7 0 0 0-1.02-1.56 1.7 1.7 0 0 0-1.88.34l-.05.05a2.05 2.05 0 0 1-2.9-2.9l.05-.05A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.02h-.15a2.05 2.05 0 0 1 0-4.1h.15A1.7 1.7 0 0 0 4.6 8.86a1.7 1.7 0 0 0-.34-1.88l-.05-.05a2.05 2.05 0 0 1 2.9-2.9l.05.05a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 10.06 2.86v-.15a2.05 2.05 0 0 1 4.1 0v.15a1.7 1.7 0 0 0 1.02 1.56 1.7 1.7 0 0 0 1.88-.34l.05-.05a2.05 2.05 0 0 1 2.9 2.9l-.05.05a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.02h.15a2.05 2.05 0 0 1 0 4.1h-.15A1.7 1.7 0 0 0 19.4 15Z" />
            </svg>
        </button>
    </div>

    <!-- Settings Panel -->
    <div id="settings-panel" class="settings modal hidden" role="dialog" aria-labelledby="settings-title">
        <div class="settings-header">
            <div>
                <h3 id="settings-title">Settings</h3>
            </div>
            <button class="btn-close icon-button" title="Close settings" aria-label="Close settings">×</button>
        </div>

        <div class="settings-body">
            <section class="settings-section">
                <h4>Desktop</h4>
                <label class="setting-row color-setting">
                    <span>
                        <strong>Background color</strong>
                        <small>Used when no image is set.</small>
                    </span>
                    <input type="color" id="setting-background-color" />
                </label>
                <label class="setting-row file-setting">
                    <span>
                        <strong>Background image</strong>
                        <small>Choose an image up to 2.5 MB.</small>
                    </span>
                    <input type="file" id="setting-background-image" accept="image/*" />
                </label>
                <button id="clear-background" class="secondary-action">Clear background color and image</button>
                <div class="settings-separator" aria-hidden="true"></div>
                <label class="setting-row range-setting">
                    <span>
                        <strong>Number of columns</strong>
                        <small><span id="setting-grid-columns-value">18</span> columns. Larger
                            number makes the tiles smaller.</small>
                    </span>
                    <input type="range" id="setting-grid-columns" min="6" max="36" step="1" />
                </label>
                <label class="setting-row range-setting">
                    <span>
                        <strong>Text size</strong>
                        <small><span id="setting-desktop-text-size-value">14</span> px.</small>
                    </span>
                    <input type="range" id="setting-desktop-text-size" min="8" max="24" step="1" />
                </label>
            </section>

            <section class="settings-section">
                <h4>Tiles</h4>
                <label class="setting-row color-setting">
                    <span>
                        <strong>Default tile color</strong>
                        <small>Applied to new and reset tiles.</small>
                    </span>
                    <input type="color" id="setting-default-tile-background-color" />
                </label>
                <label class="setting-row color-setting">
                    <span>
                        <strong>Default link text color</strong>
                        <small>Used by bookmark tiles without their own color.</small>
                    </span>
                    <input type="color" id="setting-default-link-text-color" />
                </label>
                <label class="setting-row range-setting">
                    <span>
                        <strong>Tile transparency</strong>
                        <small><span id="setting-tile-transparency-value">50%</span> transparent.</small>
                    </span>
                    <input type="range" id="setting-tile-transparency" min="0" max="100" step="1" />
                </label>
                <label class="setting-row toggle-setting">
                    <span>
                        <strong>Always show resize handle</strong>
                        <small>Keeps tile resize controls visible.</small>
                    </span>
                    <input type="checkbox" id="setting-always-show-resize-handle" />
                </label>
                <label class="setting-row toggle-setting">
                    <span>
                        <strong>Always show menu icon</strong>
                        <small>Keeps tile menu controls visible.</small>
                    </span>
                    <input type="checkbox" id="setting-always-show-menu-icon" />
                </label>
            </section>

            <section class="settings-section">
                <h4>Behavior</h4>
                <label class="setting-row toggle-setting">
                    <span>
                        <strong>Open bookmarks in new tab</strong>
                        <small>Changes apply after refresh.</small>
                    </span>
                    <input type="checkbox" id="setting-new-tab" />
                </label>
                <label class="setting-row toggle-setting">
                    <span>
                        <strong>Confirm before removing a tile</strong>
                        <small>Adds a confirmation prompt.</small>
                    </span>
                    <input type="checkbox" id="setting-confirm-remove" />
                </label>
            </section>
        </div>

        <div class="settings-footer">
            <button id="reset-settings" class="danger-action">Reset to defaults</button>
            <button class="btn-close primary-action">Done</button>
        </div>
    </div>

    <!-- Initial Setup Modal -->
    <div id="setup-prompt" class="modal hidden">
        <div class="modal-content">
            <h2>Welcome to your Signpost</h2>
            <p>How would you like to begin?</p>
            <button id="load-bookmarks">Load bookmarks from Bookmarks Bar</button>
            <button id="start-empty">Start from an empty grid</button>
        </div>
    </div>

    <!-- Bookmark Picker Modal -->
    <div id="bookmark-picker" class="modal bookmark-picker hidden" role="dialog" aria-modal="true"
        aria-labelledby="bookmark-picker-title">
        <div class="bookmark-picker-header">
            <div>
                <h2 id="bookmark-picker-title">Add bookmark or folder</h2>
                <p id="bookmark-count">Choose any saved bookmark or folder.</p>
            </div>
            <button class="btn-close icon-button" title="Close picker" aria-label="Close picker">×</button>
        </div>

        <div class="bookmark-picker-search">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="11" cy="11" r="7" />
                <path d="m16.5 16.5 4 4" />
            </svg>
            <input id="bookmark-search" type="search" placeholder="Search bookmarks" autocomplete="off"
                aria-label="Search bookmarks" />
        </div>

        <div class="bookmark-picker-body">
            <div id="bookmark-tree"></div>
            <div id="bookmark-empty" class="bookmark-empty hidden">
                <strong>No matches</strong>
                <span>Try a different bookmark title or URL.</span>
            </div>
        </div>

        <div class="bookmark-picker-footer">
            <button class="btn-close secondary-action">Cancel</button>
        </div>
    </div>

</body>

</html>
